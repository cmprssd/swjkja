[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/cmprssd/swjkja"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies (inflate, later image decoding) are hot paths even in tests that read
# the full 1.2 GB of retail assets; optimize them in dev builds too.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
