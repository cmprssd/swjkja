[package]
name = "swjkja-render"
description = "The Vulkan renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ash = { version = "0.38.0", default-features = false, features = ["loaded", "std", "debug"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
gpu-allocator = { version = "0.28.0", default-features = false, features = ["std", "vulkan"] }
swjkja-bsp = { version = "0.0.0", path = "../bsp" }
swjkja-fs = { version = "0.0.0", path = "../fs" }
swjkja-image = { version = "0.0.0", path = "../image" }
swjkja-shader = { version = "0.0.0", path = "../shader" }
swjkja-world = { version = "0.0.0", path = "../world" }

[build-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }

[dev-dependencies]
png = "0.18.1"
swjkja-fs = { path = "../fs" }
swjkja-image = { path = "../image" }
swjkja-shader = { path = "../shader" }

# bench_path's parsing and statistics have unit tests.
[[example]]
name = "bench_path"
test = true
