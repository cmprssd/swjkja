// Records bench/demos/ffa3.dm_26: eight bots fight on mp/ffa3 and the camera follows
// one of them for about 60 seconds. Executed by bench/record-demo.sh with the
// reference OpenJK client. "wait N" counts command-buffer passes, which run more than
// once per frame, so the waits below were sized by measurement, not by frame rate.
// Let the level finish initialising first: this cfg starts running mid-load.
wait 300
addbot "Kyle Katarn" 3
addbot "Luke Skywalker" 3
addbot "Tavion" 3
addbot "Desann" 3
addbot "Reborn Master" 3
addbot "Alora" 3
addbot "Boba Fett" 3
addbot "Jan Ors" 3
wait 600
team spectator
wait 120
follow 1
wait 60
record ffa3
wait 7400
stoprecord
wait 30
quit
